# scripts/check.conf — the steps behind ./scripts/check (format: scripts/check.conf.example).
# Generated by bootstrap 2026-11-14; steps activated by spec 0001 (walking skeleton).
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
#   - Vitest: watch mode outside CI is the only way it survives -> always `vitest run`
#     (also `watch: false` in vitest.config.ts); worker threads exit with the run.
#     Fastify inject() opens no port; tests close the app in afterEach.
#   - tsc: one-shot (no --watch, no build server). ESLint / Prettier: one-shot, no daemon.
#   - Vite: `vite build` exits; the dev server (`npm run dev`) never appears in check.
#   - Data: no database yet; integration tests will use a fresh in-memory SQLite per test.
# Fast/full split by selector (rule 4): *.int.test.ts = integration (full only); every other
# test file = fast (`--exclude "**/*.int.test.ts"`). Determinism: TZ=UTC and LANG fixed in the
# npm test scripts and in vitest.config.ts.
#
# --- prerequisites (what this machine must have; R-13) ---
requires typecheck: node -e "process.exit(+process.versions.node.split('.')[0] === 26 ? 0 : 1)"
requires typecheck: test -d node_modules
#
# --- steps (in order, fail fast) ---
format [fast]: npm run --silent format:check
lint [fast]: npm run --silent lint
typecheck [fast]: npm run --silent typecheck
# resource hygiene: vitest run, never watch mode
unit [fast]: npm run --silent test:fast
integration: npm run --silent test:int
build: npm run --silent build
